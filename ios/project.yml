# XcodeGen spec. The generated XEORental.xcodeproj is committed, so opening the app needs only Xcode.
# Regenerate after adding/removing files:  cd ios && xcodegen
name: XEORental
options:
  bundleIdPrefix: ink.xeo
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
packages:
  RentalKit:
    path: RentalKit
targets:
  XEORental:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: XEORental
    dependencies:
      - package: RentalKit
        product: RentalKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ink.xeo.rental
        PRODUCT_NAME: XEORental
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # Pick your team in Xcode (Signing & Capabilities). A free personal team works: no paid-only capabilities are used.
        DEVELOPMENT_TEAM: D2MF2F9GBN   # 负责人个人团队；别人构建时在 Xcode Signing 里换成自己的
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: XEORental/Info.plist
      properties:
        CFBundleDisplayName: XEO 租赁
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh_CN
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: 用于扫描柜机与 Rom 上的二维码，以及通过面部测量估算头围（测量只在本机完成，不上传）。
        CFBundleURLTypes:
          - CFBundleURLName: ink.xeo.rental
            CFBundleURLSchemes:
              - xeorental
