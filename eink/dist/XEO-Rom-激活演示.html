<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="XEO Rom 首次启动与激活 · 墨水屏演示（单文件离线）">
<title>XEO Rom 激活演示</title>
<style>/* XEO Rom 激活演示 — e-ink rules: no transition / animation / smooth scroll, black on white, ≥48px targets. */
*,*::before,*::after{box-sizing:border-box;transition:none!important;animation:none!important;scroll-behavior:auto!important}
:root{
  --ink:#000;--paper:#fff;--purple:#6638B6;--soft:#F5F5F5;--frost:#EFF1F4;--silver:#D9DDE3;--sub:#4A4A4A;
  --font:"Noto Sans CJK SC","Source Han Sans SC","PingFang SC",Geist,"Helvetica Neue",system-ui,sans-serif;
}
html,body{height:100%;margin:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--font);-webkit-tap-highlight-color:transparent;overscroll-behavior:none;font-size:clamp(16px,4.2vw,20px)}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}

.app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;max-width:600px;margin:0 auto;padding:16px 20px 14px;
  border-left:6px solid var(--purple)}
/* top bar: logo · progress · demo */
.top{display:flex;align-items:center;gap:12px;min-height:48px;flex:none}
.logo{display:block;height:30px;width:auto}
.logo svg{height:100%;width:auto;display:block}
.top .spacer{flex:1}
.stepno{font-weight:800;font-size:.8em;letter-spacing:1px;font-variant-numeric:tabular-nums}
.demo-btn{min-width:56px;min-height:48px;border:1.5px dashed var(--ink);background:var(--paper);font-size:.75em;font-weight:700;padding:0 10px}
.dots{display:flex;gap:6px;margin:10px 0 0;flex:none}
.dots i{display:block;height:8px;flex:1;border:1.5px solid var(--ink);background:var(--paper)}
.dots i.done{background:var(--ink)}
.dots i.cur{background:var(--purple);border-color:var(--ink);height:8px;outline:2px solid var(--ink);outline-offset:1px}

/* screen body */
.screen{flex:1;display:flex;flex-direction:column;padding-top:22px;min-height:0}
.kicker{margin:0 0 6px;font-size:.78em;font-weight:800;letter-spacing:2px}
h1{margin:0 0 10px;font-size:1.75em;line-height:1.25;font-weight:900;letter-spacing:-.5px}
.lead{margin:0 0 18px;font-size:1em;line-height:1.65;color:var(--ink)}
.note{font-size:.8em;line-height:1.6;color:var(--sub);margin:10px 0 0}
.grow{flex:1}
.illus{display:flex;justify-content:center;margin:6px 0 18px}
.illus svg{width:min(100%,360px);height:auto}

/* bottom actions */
.actions{display:flex;gap:10px;flex:none;padding-top:14px}
.btn{flex:1;min-height:56px;border:2.5px solid var(--ink);background:var(--paper);font-weight:800;font-size:1em;padding:0 12px}
.btn.primary{background:var(--purple);border-color:var(--ink);color:#fff}
.btn.primary::after{content:" →"}
.btn.back::before{content:"← "}
.btn:active{background:var(--ink);color:#fff}
.btn:disabled{background:var(--soft);color:var(--sub);border-style:dashed;cursor:default}
.btn.primary:disabled::after{content:""}

/* option rows (wifi / audio) */
.list{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:10px 14px;border:1.5px solid var(--ink);background:var(--paper);text-align:left}
.opt .ic{flex:none;width:34px;height:34px}
.opt .ic svg{width:100%;height:100%;display:block}
.opt .tx{flex:1;min-width:0}
.opt .tx b{display:block;font-size:1em;font-weight:800}
.opt .tx small{display:block;font-size:.8em;color:var(--sub);margin-top:2px;line-height:1.4}
.opt .mark{flex:none;width:28px;height:28px;border:2px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px}
.opt[aria-checked=true]{border-width:3.5px;padding:8px 12px;background:var(--frost)}
.opt[aria-checked=true] .mark{background:var(--ink);color:#fff}
.opt[aria-checked=true] .mark::before{content:"✓"}
.lock{font-size:.75em;font-weight:700;border:1.5px solid var(--ink);padding:0 5px}
.pw{display:flex;gap:10px;margin-top:12px}
.pw input{flex:1;min-width:0;min-height:56px;border:2px solid var(--ink);padding:0 12px;background:var(--paper);border-radius:0}
.pw .btn{flex:none;min-width:96px}
.status{margin-top:14px;min-height:56px;display:flex;align-items:center;gap:10px;padding:8px 14px;border:2.5px solid var(--ink);font-weight:800}
.status .ok{width:28px;height:28px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}

/* QR */
.qr-box{display:flex;flex-direction:column;align-items:center;margin:4px 0 8px}
.qr{display:block;background:#fff;image-rendering:pixelated;image-rendering:crisp-edges}
.qr-frame{border:2.5px solid var(--ink);padding:10px;background:#fff}
.qr-cap{margin-top:10px;font-size:.78em;font-weight:700;letter-spacing:.5px;font-variant-numeric:tabular-nums}
.how{margin:8px 0 0;padding:0;list-style:none;font-size:.85em;line-height:1.6}
.how li{display:flex;gap:8px}
.how li b{flex:none;width:22px;height:22px;border:1.5px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;font-size:.8em;margin-top:2px}

/* pod / big feature rows */
.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 14px}
.feat{border:1.5px solid var(--ink);padding:10px 6px;text-align:center;font-size:.8em;font-weight:700;line-height:1.4}
.feat svg{display:block;width:30px;height:30px;margin:0 auto 6px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;gap:12px;align-items:flex-start;line-height:1.55}
.steps li .n{flex:none;width:30px;height:30px;background:var(--ink);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center}

/* done / home */
.big-check{width:84px;height:84px;border:4px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:900;margin:8px 0 18px}
.facts{border-top:2px solid var(--ink);margin:0}
.facts div{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--ink);font-size:.9em}
.facts dt{font-weight:700;color:var(--sub)}
.facts dd{margin:0;font-weight:800;text-align:right}
.home-hero{border:2.5px solid var(--ink);padding:16px;margin:4px 0 16px}
.home-hero .state{display:inline-block;font-weight:900;font-size:.8em;letter-spacing:1px;border:2px solid var(--ink);padding:2px 8px;margin-bottom:10px}
.sys{display:flex;gap:10px;align-items:center;font-size:.75em;font-weight:700}
.sys svg{width:20px;height:20px;display:block}
.foot{flex:none;margin-top:14px;padding-top:8px;border-top:1px solid var(--ink);font-size:.7em;line-height:1.5;color:var(--sub);display:flex;justify-content:space-between}

/* full-screen popups (no dimmed backdrop: grey dithers on e-ink) */
.sheet{position:fixed;inset:0;z-index:20;background:var(--paper);overflow:auto}
.sheet .app{min-height:100%}
.alert{display:inline-flex;align-items:center;gap:8px;font-weight:900;font-size:.85em;letter-spacing:1px;border:2.5px solid var(--ink);padding:4px 10px;margin-bottom:12px}
.alert.warn{background:var(--ink);color:#fff}
.due{font-size:1.05em;line-height:1.7;margin:0 0 14px}
.due b{font-variant-numeric:tabular-nums}
.big-num{font-size:2.6em;font-weight:900;line-height:1;margin:0 4px;font-variant-numeric:tabular-nums}
.menu{display:flex;flex-direction:column;gap:10px}
.menu .btn{flex:none;text-align:left}

@media (min-width:700px){.app{max-width:680px;padding:28px 36px 20px}body{font-size:21px}.logo{height:36px}}
</style>
</head>

<script>//---------------------------------------------------------------------
//

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.

    const dpr = Math.max(1, Math.round(window.devicePixelRatio || 1));
    const px = mod * dpr;
    canvas.width = total * px; canvas.height = total * px;
    canvas.style.width = canvas.style.height = total * mod + 'px';

    c.fillStyle = '#000';
    for (let r = 0; r < n; r++) for (let col = 0; col < n; col++) if (q.isDark(r, col)) c.fillRect((col + quiet) * px, (r + quiet) * px, px, px);

    podMore: () => top(4) + '<section class="screen"><p class="kicker">XEO POD · 了解更多</p><h1>把巨幕，带进一个<br>只属于你的空间</h1>' +

        '<div class="grow"></div><div class="actions"><button class="btn" data-act="close">关闭，继续使用</button></div></section></div>';

  // ---------- render ----------
  function render() {
    const root = $('#root');
    root.innerHTML = '<div class="app">' + SCREENS[S.step]() + '</div>';
    let sheet = $('#sheet');
    if (S.sheet) {
      if (!sheet) { sheet = document.createElement('div'); sheet.id = 'sheet'; sheet.className = 'sheet'; sheet.setAttribute('role', 'dialog'); document.body.append(sheet); }

      root.setAttribute('aria-hidden', 'true');
    } else { if (sheet) sheet.remove(); root.removeAttribute('aria-hidden'); }
    for (const c of document.querySelectorAll('canvas[data-qr]')) drawQr(c, c.getAttribute('data-qr'), qrTarget());
    window.scrollTo(0, 0);
  }
  function go(step) { S.step = step; render(); }
  function persist() { save({ activated: S.step === 'done' || S.step === 'home' || load().activated, wifi: S.wifi, audio: S.audio }); }

  const ACT = {
    next() { const i = SETUP.indexOf(S.step); go(S.step === 'podMore' ? 'big' : SETUP[i + 1]); },
    prev() { const i = SETUP.indexOf(S.step); go(SETUP[Math.max(0, i - 1)]); },
    skip() { go('big'); },
    podMore() { go('podMore'); },
    podBack() { go('pod'); },
    wifi(el) { S.wifiPick = el.dataset.ssid; S.wifiConnected = false; S.wifi = null; render(); const f = $('#ssid') || $('#pw'); if (f) f.focus(); },
    connect() {
      const other = WIFI.find(w => w.ssid === S.wifiPick && w.other), typed = other && $('#ssid') ? $('#ssid').value.trim() : '';
      S.wifi = other ? (typed || '自定义网络') : S.wifiPick; S.wifiConnected = true; render();
    },
    audio(el) { S.audio = el.dataset.id; render(); },
    finish() { go('done'); persist(); },
    home() { go('home'); persist(); },
    demo() { S.sheet = 'demo'; render(); },
    soon() { S.sheet = 'soon'; render(); },
    soonQr() { S.sheet = 'soonQr'; render(); },
    overdue() { S.sheet = 'overdue'; render(); },
    close() { S.sheet = null; render(); },
    reset() { try { localStorage.removeItem(STORE); } catch (e) {} Object.assign(S, { step: 'welcome', wifi: null, wifiPick: null, wifiConnected: false, audio: null, sheet: null }); render(); },
    fullscreen() {
      const el = document.documentElement, rq = el.requestFullscreen || el.webkitRequestFullscreen;
      S.sheet = null; render();
      if (rq) try { const p = rq.call(el); if (p && p.catch) p.catch(() => {}); } catch (e) {}
    },
  };
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = ACT[el.dataset.act]; if (fn) fn(el);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'pw') ACT.connect(); });
  let rt = null;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 200); });
  render();
  window.__romDemo = { state: S, act: ACT, payloads: { activate: QR_ACTIVATE, renew: QR_RENEW } };
})();
</script>
